# Local development settings - DO NOT COMMIT
# This file is gitignored. Copy from config/settings.yaml.example and fill in your values.

api_key: "«redacted:sk-…»"
base_url: "https://openrouter.ai/api/v1"

rate_limits:
  rpm: 60
  rph: 500

retry:
  max_attempts: 3
  base_delay_seconds: 1.0
  max_delay_seconds: 60.0
  exponential_base: 2

timeout_seconds: 30

database_path: "data/monitor.db"

# Telegram configuration for alerts
telegram:
  bot_token: ""  # Your Telegram bot token
  chat_id: ""    # Your Telegram chat ID
  parse_mode: "HTML"
  disable_web_page_preview: true